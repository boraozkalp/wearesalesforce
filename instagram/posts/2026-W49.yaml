- id: 3_cum_itiraz
  date: "2026-12-04 (Cuma) 17:30"
  format: Tek görsel
  slides:
  - theme: dark
    html: |
      <span class="tag">İtiraz yönetimi</span>
      <h2>İtiraza <em>iskontoyla</em><br>cevap vermeyin.</h2>
      <ol class="n">
       <li><b>Dinleyin</b>sözünü kesmeden, sonuna kadar</li>
       <li><b>Kabul edin</b>“Bu endişeyi anlıyorum.”</li>
       <li><b>Netleştirin</b>“Birim fiyat mı, toplam maliyet mi?”</li>
       <li><b>Yanıtlayın</b>fayda, kanıt veya alternatifle</li>
       <li><b>Teyit edin</b>“Bu sorunuzu yanıtladı mı?”</li>
      </ol>
  caption: |
    “Fiyatınız yüksek.” 💬
    En pahalı cevap: hemen iskonto vermek.

    İtiraz bir ret değil, ilgi işaretidir. Müşteri düşünüyor ve eksik bir bilgi ya da bir endişe dile getiriyor.

    5 adım:
    1. Dinleyin
    2. Kabul edin (haklı olduğunu değil, duyduğunuzu)
    3. Netleştirin
    4. Yanıtlayın
    5. Teyit edin

    Ekibinizde itiraza ilk tepki ne? Yorumlarda paylaşın 👇

    Rehberin tamamı: wearesalesforce.com → Rehber → Müşteri ziyareti
  hashtags: "#itirazyönetimi #satış #müzakere #satışyönetimi #sahasatışı #satıştemsilcisi #salestraining #objectionhandling #wearesalesforce"
